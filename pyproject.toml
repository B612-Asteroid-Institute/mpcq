[project]
name = "mpcq"
dynamic = ["version"]
authors = [
  { name = "Spencer Nelson", email = "spencer@b612foundation.org" },
  { name = "Nate Tellis", email = "nate@b612foundation.org" },
  { name = "Alec Koumjian", email = "alec@b612foundation.org" },
  { name = "Joachim Moeyens", email = "moeyensj@uw.edu" },
]
description = "Client library for interacting with an MPC observations database"
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]
license = { file = "LICENSE.md" }

keywords = ["astronomy", "orbital mechanics", "propagation"]

dependencies = [
    # Core 0.8 is the released registry line exercised across the complete
    # Python support matrix. Earlier Core releases are intentionally unclaimed.
    "adam-core>=0.8.0,<0.9.0",
    "astropy",
    "google-cloud-bigquery",
    "google-cloud-secret-manager",
    "numpy",
    "pyarrow>=21.0.0",
    "quivr",
    "google-cloud-bigquery-storage>=2.27.0",
    "tqdm>=4.67.1"
]

[build-system]
requires = ["pdm-backend==2.5.0"]
build-backend = "pdm.backend"
[tool.pdm.build]
package-dir = "src"
includes = ["src/mpcq/"]

[tool.pdm.version]
source = "scm"
# write_to is relative to the wheel root; package-dir must not be repeated.
write_to = "mpcq/_version.py"
write_template = "__version__ = '{}'"


[tool.pdm.scripts]
check = { composite = ["format", "lint", "typecheck", "test"] }
format = { composite = ["ruff format ./src/mpcq"] }
lint = { composite = [
  "ruff check ./src/mpcq",
] }
fix = { composite = ["ruff format ./src/mpcq", "ruff check --fix ./src/mpcq"] }
typecheck = "mypy --strict ./src/mpcq"

test = "pytest --benchmark-disable {args}"
doctest = "pytest --doctest-plus --doctest-only"
benchmark = "pytest --benchmark-only"
coverage = "pytest --cov=mpcq --cov-report=xml"

# Documentation commands
docs-build = "sphinx-build -b html docs/source docs/build"
docs-clean = { shell = "rm -rf docs/build" }
docs-serve = { shell = "python -m http.server --directory docs/build" }
docs-live = "sphinx-autobuild docs/source docs/build"


[project.urls]
"Documentation" = "https://github.com/B612-Asteroid-Institute/mpcq#README.md"
"Issues" = "https://github.com/B612-Asteroid-Institute/mpcq/issues"
"Source" = "https://github.com/B612-Asteroid-Institute/mpcq"


[project.optional-dependencies]
dev = [
    "ipython",
    "mypy",
    "pdm",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-doctestplus",
    "pytest-mock>=3.14.1",
    "pytest>=8.4.1",
    "ruff",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autobuild",
    "pandas>=2.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build"]

[tool.ruff.lint]
ignore = []
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["mpcq"]

[tool.mypy]
ignore_missing_imports = true

# pyarrow ships a py.typed marker but its compute/parquet helpers are generated
# dynamically at import time, so mypy cannot see attributes like pc.is_in or
# pq.read_table and reports false attr-defined / no-untyped-call errors. Treat
# the package as untyped so type checking stays stable across pyarrow versions.
[[tool.mypy.overrides]]
module = "pyarrow.*"
follow_imports = "skip"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require live BigQuery access",
]

[tool.coverage.run]
relative_files = true
source = ["mpcq"]
omit = ["*/mpcq/tests/*", "mpcq/tests/*", "*/mpcq/_version.py", "mpcq/_version.py"]

[tool.coverage.paths]
source = ["src/mpcq", "*/site-packages/mpcq"]

[tool.coverage.report]
omit = ["*/mpcq/tests/*", "mpcq/tests/*", "*/mpcq/_version.py", "mpcq/_version.py"]
